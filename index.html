<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wingo 30S — BBBBBBBBBB</title>
<style>
body{margin:0;background:#080d18;color:#eef2ff;font-family:Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:18px}
.card{background:#111a30;border:1px solid #263250;border-radius:18px;padding:20px;margin-bottom:16px}
h1{margin:0 0 8px;font-size:25px}
.muted{color:#9aa7c7}
.status{padding:12px;border-radius:12px;background:#202a45;margin-top:14px}
.pred{font-size:58px;font-weight:900;text-align:center;padding:25px;background:#0e1528;border-radius:15px;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}
.box{background:#0e1528;padding:18px;border-radius:14px;text-align:center}
.value{font-size:30px;font-weight:800;margin-top:7px}
.win{color:#22c55e}.loss{color:#ef4444}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:10px;border-bottom:1px solid #28324c;text-align:center}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">

<div class="card">
<h1>🔮 Wingo 30S — BBBBBBBBBB</h1>
<div class="muted">Fixed B prediction • Live tracker data</div>
<div id="status" class="status">Connecting...</div>
</div>

<div class="card">
<div class="muted">CURRENT PREDICTION</div>
<div id="pred" class="pred">B</div>
<div id="issue" class="muted" style="text-align:center;margin-top:10px">Loading...</div>
</div>

<div class="grid">
<div class="box"><div class="muted">WIN</div><div id="win" class="value win">0</div></div>
<div class="box"><div class="muted">LOSS</div><div id="loss" class="value loss">0</div></div>
<div class="box"><div class="muted">TOTAL</div><div id="total" class="value">0</div></div>
<div class="box"><div class="muted">WIN RATE</div><div id="rate" class="value">0%</div></div>
</div>

<div class="card" style="margin-top:16px">
<b>📜 HISTORY</b>
<table>
<thead><tr><th>Issue</th><th>Prediction</th><th>Result</th><th>Status</th></tr></thead>
<tbody id="history"><tr><td colspan="4">Loading...</td></tr></tbody>
</table>
</div>

</div>

<script>
async function load(){
try{
const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
const d=await r.json();

const cp=d.current_prediction||{};
document.getElementById("pred").textContent="B";
document.getElementById("issue").textContent="Issue: "+(cp.issue||"Waiting...");
document.getElementById("status").textContent="🟢 BBBBBBBBBB tracker connected";

const h=Array.isArray(d.history)?d.history:[];
const wins=h.filter(x=>x.status==="WIN").length;
const losses=h.filter(x=>x.status==="LOSS").length;
const total=wins+losses;
const rate=total?((wins/total)*100).toFixed(1):"0";

document.getElementById("win").textContent=wins;
document.getElementById("loss").textContent=losses;
document.getElementById("total").textContent=total;
document.getElementById("rate").textContent=rate+"%";

const rows=h.slice().reverse().slice(0,50).map(x=>
`<tr><td>${x.issue||"-"}</td><td><b>B</b></td><td>${x.result||"-"}</td><td class="${x.status==="WIN"?"win":"loss"}">${x.status||"-"}</td></tr>`
).join("");

document.getElementById("history").innerHTML=rows||'<tr><td colspan="4">No history yet</td></tr>';
}catch(e){
document.getElementById("status").textContent="🟠 Waiting for tracker data...";
}
}
load();
setInterval(load,5000);
</script>
</body>
</html>
